name: freezify

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: freezify
      POSTGRES_USER: freezify
      POSTGRES_PASSWORD: ${FREEZIFY_DB_PASSWORD:?Set FREEZIFY_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freezify -d freezify"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      FREEZIFY_DB_URL: jdbc:postgresql://postgres:5432/freezify
      FREEZIFY_DB_USER: freezify
      FREEZIFY_DB_PASSWORD: ${FREEZIFY_DB_PASSWORD:?Set FREEZIFY_DB_PASSWORD in .env}
      FREEZIFY_JWT_SECRET: ${FREEZIFY_JWT_SECRET:?Set FREEZIFY_JWT_SECRET in .env}
      FREEZIFY_CORS_ALLOWED_ORIGINS: ${FREEZIFY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Push notifications: the path of the Firebase key inside the container, under /run/secrets/freezify.
      # Empty, no push is sent.
      FREEZIFY_FCM_CREDENTIALS_FILE: ${FREEZIFY_FCM_CREDENTIALS_FILE_IN_CONTAINER:-}
      # The description of the API (Swagger UI) is off unless asked for.
      FREEZIFY_API_DOCS: ${FREEZIFY_API_DOCS:-false}
      # The web's session cookie is only sent over HTTPS; false only to try it over plain http.
      FREEZIFY_REFRESH_COOKIE_SECURE: ${FREEZIFY_REFRESH_COOKIE_SECURE:-true}
    volumes:
      # A folder outside the repository with the secrets that are files, mounted read-only.
      - ${FREEZIFY_SECRETS_DIR:-./.secrets}:/run/secrets/freezify:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres-data:
