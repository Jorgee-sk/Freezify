spring:
  application:
    name: freezify
  datasource:
    url: ${FREEZIFY_DB_URL:jdbc:postgresql://localhost:5432/freezify}
    username: ${FREEZIFY_DB_USER:freezify}
    password: ${FREEZIFY_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${FREEZIFY_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # The description of the API is not published by a deployed instance unless FREEZIFY_API_DOCS=true.
  api-docs:
    enabled: ${FREEZIFY_API_DOCS:false}
  swagger-ui:
    enabled: ${FREEZIFY_API_DOCS:false}
    path: /swagger-ui.html

freezify:
  # Calendar days (purchase, expiration) are computed in this zone.
  time-zone: ${FREEZIFY_TIME_ZONE:Europe/Madrid}
  auth:
    # No default on purpose: the application must not start without a real secret.
    jwt-secret: ${FREEZIFY_JWT_SECRET}
    issuer: ${FREEZIFY_JWT_ISSUER:freezify}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${FREEZIFY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    capacity: 20
    period: 1m
    paths:
      - /api/v1/auth/
      - /api/v1/households/join
  households:
    invitation-ttl: 7d
  expiration:
    # Shortly after midnight in freezify.time-zone, when dates change meaning.
    sweep-cron: "0 5 0 * * *"
  notifications:
    # Every hour on the hour in freezify.time-zone: each user is told at the hour they chose.
    check-cron: "0 0 * * * *"
    # Notifications older than this are deleted every night.
    retention: 90d
    cleanup-cron: "0 45 3 * * *"
  recipes:
    # How much each factor counts in the score of a recommended recipe. Only their proportions matter.
    weights:
      ingredient-match: 0.35
      expiry-urgency: 0.30
      convenience: 0.10
      novelty: 0.10
  meal-planning:
    # How much each factor counts when the generator chooses the recipe of a meal. Only their proportions matter.
    weights:
      waste: 0.35
      pantry: 0.25
      variety: 0.20
      novelty: 0.10
      effort: 0.10
  push:
    # Path of the Firebase service account key. Without it nothing is sent and notifications are only seen
    # inside the app. The key itself never goes into the repository or an image.
    fcm-credentials-file: ${FREEZIFY_FCM_CREDENTIALS_FILE:}
    fcm-endpoint: https://fcm.googleapis.com
  realtime:
    # Event streams end after this long; clients reconnect and are authenticated again.
    connection-ttl: 30m
    heartbeat: 25s
