freezify:
  auth:
    jwt-secret: test-only-secret-test-only-secret-test-only
  rate-limit:
    # All MockMvc requests share one client address; the limiter has its own unit test.
    capacity: 100000
  notifications:
    # Tests run the check themselves; a run on the hour in the middle of a test would get in the way.
    check-cron: "-"
    cleanup-cron: "-"

logging:
  level:
    com.freezify.auth.internal.TokenService: ERROR
