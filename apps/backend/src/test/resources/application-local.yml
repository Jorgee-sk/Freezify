# Local development only (mvnw spring-boot:test-run). Never used by the packaged application.
freezify:
  auth:
    jwt-secret: ${FREEZIFY_JWT_SECRET:local-development-only-secret-do-not-deploy}
  cors:
    allowed-origins: http://localhost:5173

# Swagger UI is handy while developing; a deployed instance does not publish it.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.freezify: DEBUG
